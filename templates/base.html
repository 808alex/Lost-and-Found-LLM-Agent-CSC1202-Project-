<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DCU Lost & Found{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'items:home' %}">🔍 DCU Lost & Found</a>
      <div class="navbar-nav ms-auto align-items-center">
        {% if user.is_authenticated %}
          <a class="nav-link" href="{% url 'items:report' 'found' %}">Report found</a>
          <a class="nav-link" href="{% url 'items:report' 'lost' %}">Report lost</a>
          <form method="post" action="{% url 'logout' %}" class="d-inline">
            {% csrf_token %}
            <button class="btn btn-link nav-link">Log out ({{ user.username }})</button>
          </form>
        {% else %}
          <a class="nav-link" href="{% url 'login' %}">Log in</a>
          <a class="nav-link" href="{% url 'signup' %}">Sign up</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container">
    {% for message in messages %}
      <div class="alert alert-success">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
