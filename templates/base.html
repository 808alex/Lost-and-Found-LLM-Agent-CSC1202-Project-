<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DCU Lost & Found{% endblock %}</title>
  <style>
    :root {
      --navy: #2b3445;
      --navy-light: #3d475b;
      --orange: #ff6600;
      --orange-dark: #e65c00;
      --input-bg: #e8f0fe;
      --text: #ffffff;
      --muted: #b8c0cf;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Roboto", "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(ellipse at top left, var(--navy-light), var(--navy) 60%) fixed;
    }
    a { color: var(--orange); }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 16px 24px;
      background: rgba(0, 0, 0, 0.2);
    }
    header .brand { font-size: 1.2rem; font-weight: 500; color: var(--text); text-decoration: none; }
    header nav { display: flex; align-items: center; gap: 20px; }
    header nav a { color: var(--text); text-decoration: none; }
    header nav a:hover { color: var(--orange); }
    header form { margin: 0; }
    .link-button { background: none; border: none; color: var(--muted); font: inherit; cursor: pointer; padding: 0; }
    .link-button:hover { color: var(--orange); }

    main { max-width: 860px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-weight: 500; }
    h2 { font-weight: 500; font-size: 1.2rem; margin-top: 32px; }

    /* Forms */
    .form { max-width: 520px; }
    .form label { display: block; font-size: 1.1rem; margin: 20px 0 10px; }
    .form input, .form textarea, .form select {
      width: 100%;
      padding: 12px 14px;
      font: inherit;
      color: #000;
      background: var(--input-bg);
      border: 1px solid #9aa3b5;
      border-radius: 6px;
    }
    .form input:focus, .form textarea:focus, .form select:focus { outline: none; border-color: var(--orange); }
    .form input[type="file"] { background: transparent; color: var(--text); border: none; padding: 0; }
    .form .helptext { display: block; color: var(--muted); font-size: 0.85rem; margin-top: 6px; }
    .form .errorlist { color: #ffb38a; list-style: none; padding: 0; margin: 6px 0 0; }
    .btn {
      display: inline-block;
      padding: 14px 24px;
      font: inherit;
      font-size: 1.1rem;
      color: #fff;
      background: var(--orange);
      border: none;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:hover { background: var(--orange-dark); }
    .btn-block { width: 100%; margin-top: 24px; }
    .btn-outline { background: transparent; border: 2px solid var(--orange); }
    .btn-outline:hover { background: rgba(255, 102, 0, 0.15); }

    /* Lists & cards */
    .card { background: rgba(255, 255, 255, 0.06); border-radius: 8px; padding: 4px 0; }
    .card ul { list-style: none; margin: 0; padding: 0; }
    .card li { padding: 12px 18px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .card li:last-child { border-bottom: none; }
    .card li a { color: var(--text); text-decoration: none; font-weight: 500; }
    .card li a:hover { color: var(--orange); }
    .muted { color: var(--muted); }
    .badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; background: var(--orange); margin-left: 6px; }
    .alert { background: rgba(255, 102, 0, 0.2); border-left: 4px solid var(--orange); padding: 12px 16px; border-radius: 4px; margin-bottom: 20px; }
  </style>
</head>
<body>
  {% if user.is_authenticated %}
  <header>
    <a class="brand" href="{% url 'items:home' %}">DCU Lost &amp; Found</a>
    <nav>
      <a href="{% url 'items:find' %}">Find my item</a>
      <a href="{% url 'items:report' %}">Report lost</a>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="link-button">Log out</button>
      </form>
    </nav>
  </header>
  {% endif %}

  <main>
    {% for message in messages %}
      <div class="alert">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
