{% extends "base.html" %}

{% block title %}Log in · DCU Lost & Found{% endblock %}

{% block content %}
<style>
  .login { max-width: 520px; margin: 12vh auto 0; }
  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 48px; }
  .toggle-password {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: #fff; opacity: 0.8; font-size: 1.1rem;
  }
</style>

<div class="login">
  <form method="post" class="form" style="max-width:none">
    {% csrf_token %}
    {% if form.errors %}
      <ul class="errorlist"><li>Your username and password didn't match. Please try again.</li></ul>
    {% endif %}

    <label for="id_username">Username</label>
    <input type="text" name="username" id="id_username" value="{{ form.username.value|default:'' }}" autocomplete="username" autofocus required>

    <label for="id_password">Password</label>
    <div class="password-wrap">
      <input type="password" name="password" id="id_password" autocomplete="current-password" required>
      <button type="button" class="toggle-password" aria-label="Show password"
              onclick="const p = document.getElementById('id_password'); p.type = p.type === 'password' ? 'text' : 'password';">&#128065;</button>
    </div>

    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-block">Login</button>
  </form>
</div>
{% endblock %}
