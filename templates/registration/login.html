{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<h1>Log in</h1>
<form method="post" class="col-md-6">
  {% csrf_token %}
  {{ form.as_div }}
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn btn-primary mt-3">Log in</button>
</form>
<p class="mt-3">No account? <a href="{% url 'signup' %}">Sign up</a></p>
{% endblock %}
