{% extends "base.html" %}

{% block title %}Report {{ kind }} item{% endblock %}

{% block content %}
<h1>Report a {{ kind }} item</h1>
<form method="post" enctype="multipart/form-data" class="col-md-8">
  {% csrf_token %}
  {{ form.as_div }}
  <button class="btn btn-primary mt-3">Submit</button>
</form>
{% endblock %}
