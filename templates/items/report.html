{% extends "base.html" %}

{% block title %}Report a lost item · DCU Lost & Found{% endblock %}

{% block content %}
<h1>Report a lost item</h1>
<form method="post" enctype="multipart/form-data" class="form">
  {% csrf_token %}
  {{ form.as_div }}
  <button class="btn btn-block">Submit</button>
</form>
{% endblock %}
